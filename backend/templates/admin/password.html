{% extends "base.html" %}
{% block title %}改我的密码{% endblock %}
{% block content %}
<h2>改我的密码</h2>
<nav class="admin-nav">
  <a href="/admin">总览</a>
  <a href="/admin/items">条目管理</a>
  <a href="/admin/categories">分类开关</a>
  <a href="/admin/users">账号管理</a>
  <a href="/admin/password" class="on">改我的密码</a>
</nav>
{% if request.query_params.get("msg") == "ok" %}<div class="ok">密码改好了。</div>{% endif %}
{% if request.query_params.get("msg") == "bad" %}<div class="alert">旧密码不对，或新密码太短（至少 4 位）。</div>{% endif %}
<form method="post" action="/admin/password" class="form">
  <label>旧密码<input type="password" name="old" required></label>
  <label>新密码（至少 4 位）<input type="password" name="new" required minlength="4"></label>
  <button type="submit">改密码</button>
</form>
{% endblock %}
